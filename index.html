<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue OS — Creator & Consultant Command Center</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">

        <!-- Left sidebar navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="brand-glyph">⚡</span>
                <span class="brand-wordmark">Revenue<b>OS</b></span>
            </div>

            <nav class="sidebar-nav">
                <a class="nav-item" data-view="dashboard" href="#dashboard">
                    <span class="nav-icon">🏠</span>
                    <span>Dashboard</span>
                </a>
                <div class="nav-section">Agents</div>
                <a class="nav-item" data-view="leads" href="#leads">
                    <span class="nav-icon">🎯</span>
                    <span>Lead Generation</span>
                    <span class="dot" id="dot-leads"></span>
                </a>
                <a class="nav-item" data-view="sales" href="#sales">
                    <span class="nav-icon">💼</span>
                    <span>Sales & Follow-up</span>
                    <span class="dot" id="dot-sales"></span>
                </a>
                <a class="nav-item" data-view="content" href="#content">
                    <span class="nav-icon">✍️</span>
                    <span>Content Creator</span>
                    <span class="dot" id="dot-content"></span>
                </a>
                <a class="nav-item" data-view="analytics" href="#analytics">
                    <span class="nav-icon">📈</span>
                    <span>Analytics</span>
                    <span class="dot" id="dot-analytics"></span>
                </a>
                <a class="nav-item" data-view="pricing" href="#pricing">
                    <span class="nav-icon">💰</span>
                    <span>Pricing Agent</span>
                    <span class="dot" id="dot-pricing"></span>
                </a>
                <div class="nav-section">Account</div>
                <a class="nav-item" data-view="settings" href="#settings">
                    <span class="nav-icon">⚙️</span>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-user">
                <div class="avatar" id="sidebar-avatar">AR</div>
                <div class="user-meta">
                    <span class="user-name" id="sidebar-username">Alex Rivera</span>
                    <span class="user-role">Consultant</span>
                </div>
            </div>
        </aside>

        <!-- Main content — views are injected here by app.js -->
        <main class="main" id="main"></main>
    </div>

    <!-- Toast notification (shown after agent runs) -->
    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
